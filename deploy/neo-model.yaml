# COPY for reference. The source of truth is /opt/argocd/tenants/neo/neo-model.yaml (repo AIT-AI/rad_argocd, Argo CD app iotonix-neo).
# NEO data model service 0.3.1 (repo ralf100mark/neo-pr-next, docs/OPERATIONS.md + PIPELINE.md): keeps neo_model current every 5 min.
# Reads the asset config (Postgres pr_live_neodb) and L0 (raw.api_response, written by huawei-api) and writes only neo_model:
# L1 (module l1_huawei) and the L2 modules of meta.module (PR iec_61724_1 + neo_customer, interval + daily) on dirty windows. Config: SealedSecret neo-model-env.
# NetworkPolicy model-egress: this namespace + DNS only. Recreate: one writer at a time. Ralf 2026-11-22.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neo-model
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: neo-model
  template:
    metadata:
      labels:
        app: neo-model
        neo/part-of: model
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: neo-model
          image: registry.ait.co.th/iotonix/neo-model:0.3.1@sha256:7f531adbd9d3f28d6e8c6a049c8a435a00a97a59e09b08eca74aa3b6c0c7c05e
          envFrom:
            - secretRef:
                name: neo-model-env
          env:
            - name: L1_SOURCE          # l0: L1 from the consumer's Postgres L0 (module l1_huawei); influx: interim Influx ingest
              value: l0
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 4Gi }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: model-egress
spec:
  podSelector:
    matchLabels:
      neo/part-of: model
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
